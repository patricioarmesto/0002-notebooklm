services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notebooklm
      POSTGRES_USER: notebooklm
      POSTGRES_PASSWORD: notebooklm
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebooklm -d notebooklm"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull llama3.2:3b"]
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://notebooklm:notebooklm@postgres:5432/notebooklm
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_LLM_MODEL: llama3.2:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      COLLECTION_NAME: notebooklm_chunks
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      model-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed-docs:
    image: curlimages/curl:8.10.1
    volumes:
      - ./docs/seed:/seed:ro
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for f in /seed/*.txt; do
          echo "Seeding $$f"
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            -F "file=@$$f;type=text/plain" \
            -F "title=$$(basename $$f .txt)" \
            http://backend:8000/api/upload > /dev/null || exit 1
        done
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      seed-docs:
        condition: service_completed_successfully

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
